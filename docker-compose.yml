services:
  clang-tidy-gjb8114:
    image: ghcr.io/gjb8114/clang-tidy-gjb8114:latest
    volumes:
      - .:/workspace
    working_dir: /workspace
    entrypoint: ["clang-tidy"]
    # Example: override with your own arguments
    # command: ["your_file.cpp", "-checks='-*,gjb8114-*'", "-load=/usr/local/lib/libclang-tidy-gjb8114.so"]
